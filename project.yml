name: ThanksgivingCountdown
options:
  bundleIdPrefix: studio.mikegyver
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"
targets:
  ThanksgivingCountdown:
    type: application
    platform: iOS
    sources:
      - path: ThanksgivingCountdown
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.thanksgiving
        INFOPLIST_FILE: ThanksgivingCountdown/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${APP_PROFILE_UUID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
    dependencies:
      - target: ThanksgivingWidget
        embed: true
  ThanksgivingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ThanksgivingWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.thanksgiving.widget
        INFOPLIST_FILE: ThanksgivingWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${WIDGET_PROFILE_UUID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        APPLICATION_EXTENSION_API_ONLY: YES
